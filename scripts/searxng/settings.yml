# VELOX SearXNG configuration (self-hosted). Enable ONLY upstream engines whose terms permit automated
# queries. Scraping engines (Google, Bing, DuckDuckGo, Startpage, …) are deliberately not enabled.
# The secret key comes from the SEARXNG_SECRET environment variable at runtime (never committed).
use_default_settings:
  engines:
    keep_only:
      - wikipedia
      - wikidata
general:
  instance_name: "VELOX research"
search:
  safe_search: 1
  formats: [html, json]
server:
  limiter: false          # private instance behind VELOX; rate limits are applied by VELOX (1 req/s)
  public_instance: false
  image_proxy: false
outgoing:
  request_timeout: 6.0
  useragent_suffix: "VELOX-catalog-bot"
